catalog_metadata:
  healpix_discretization_3d:
    nside: 1
cosmology_model_name: FlatLambdaCDM
cosmology_numerics:
  z_max: 8.0
  z_min: 1.0e-05
  z_steps: 100000
kwargs_data: {}
distribution_names:
  mass_1_s: power_law_peak2_partial_windowed
  mass_ratio: mass_ratio_running_power_law_in_log
  redshift: MadauDickinson
kwargs_priors:
  cosmology:
    h:
      dist_type: Uniform
      max: 2.0
      min: 0.2
    Omega_m:
      dist_type: Delta
      value: 0.3
  rate: {}
  redshift:
    gamma:
      dist_type: Uniform
      max: 5.0
      min: 0.0
    kappa:
      dist_type: Uniform
      max: 6.0
      min: 0.0
    zp:
      dist_type: Uniform
      max: 4.0
      min: 0.0
  mass_1_s:
    lambda_g:
      dist_type: Uniform
      max: 1.0
      min: 0.0
    lambda_g_low:
      dist_type: Uniform
      max: 1.0
      min: 0.0
    alpha:
      dist_type: Uniform
      max: 12.0
      min: 1.5
    delta_m:
      dist_type: Uniform
      max: 10.0
      min: 0.001
    mmin:
      dist_type: Uniform
      max: 10.0
      min: 2.0
    mmax:
      dist_type: Uniform
      max: 200.0
      min: 55.0
    mu_g_low:
      dist_type: Uniform
      max: 15.0
      min: 5.0
    sigma_g_low:
      dist_type: Uniform
      max: 5.0
      min: 0.4
    mu_g_high:
      dist_type: Uniform
      max: 100.0
      min: 15.0
    sigma_g_high:
      dist_type: Uniform
      max: 15.0
      min: 0.4
  mass_ratio:
    beta_0:
      dist_type: Uniform
      max: 4.0
      min: -2.0
    beta_1:
      dist_type: Delta
      value: 0.00
    mass_ratio_running_zero_point:
      dist_type: Delta
      value: 10.0
kwargs_sampler:
  gibbs_mode: 0
  max_tree_depth: 10
  num_chains: 1
  target_accept_prob: 0.8
  num_svi_samples: 1000
  num_svi_steps: 0

# likelihood_evaluation:
  # posterior_samples_batch_size: 10000000
  # injections_batch_size: 10000000
  # penalty_factor_relative_variance: 0.1
  # save_effective_sample_sizes: False

results_path: /PATH_RESULT/

bins:
  mass_1_s:
    max: 390.0
    min: 0.9
    num: 2000
  mass_ratio:
    max: 1.0
    min: 0.01
    num: 200
  redshift:
    max: 8.0
    min: 0.0
    num: 2000
  redshift_grid_interpolation: smooth_log
  mass_grid_interpolation: smooth_log
